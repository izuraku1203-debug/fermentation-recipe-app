<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>発酵料理レシピ</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="発酵料理レシピ">
<meta name="theme-color" content="#7a4f2e">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --text: #1e1a14;
    --text-light: #5a5048;
    --accent: #7a4f2e;
    --accent-light: #c49a6c;
    --tag-bg: #ede8e0;
    --border: #d8d0c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-weight: 400;
    font-size: 15px;
  }

  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo-img-wrap {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.15);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-img { width: 48px; height: 48px; object-fit: contain; display: block; }
  .logo {
    font-family: 'Noto Serif JP', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .logo span {
    font-size: 12px;
    color: var(--text-light);
    display: block;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 400;
    margin-top: 2px;
  }

  main { max-width: 600px; margin: 0 auto; padding: 20px 14px 80px; }

  .filter-section { margin-bottom: 20px; }
  .filter-label {
    font-size: 12px;
    color: var(--text-light);
    letter-spacing: 0.12em;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  .chip {
    padding: 8px 16px;
    border-radius: 22px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 400;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }
  .chip:hover { border-color: var(--accent-light); color: var(--accent); }
  .chip.active { color: white; font-weight: 500; border-color: transparent; }
  .chip[data-val="塩麹"].active    { background: #4a7a3a; }
  .chip[data-val="しょうゆ麹"].active { background: #7a4a1a; }
  .chip[data-val="味噌"].active    { background: #8a4a10; }
  .chip[data-val="赤酒"].active    { background: #7a1a1a; }
  .chip[data-val="甘酒"].active    { background: #5a4a7a; }
  .chip[data-val="酒粕"].active    { background: #2a5a6a; }
  .chip[data-val="主食"].active         { background: #3a6a3a; }
  .chip[data-val="魚おかず"].active     { background: #1a4a7a; }
  .chip[data-val="肉おかず"].active     { background: #7a1a1a; }
  .chip[data-val="野菜おかず"].active   { background: #3a6a1a; }
  .chip[data-val="汁物"].active         { background: #1a5a5a; }
  .chip[data-val="おやつ・スイーツ"].active { background: #6a1a5a; }
  .chip[data-val="その他"].active       { background: #3a3a3a; }
  .chip[data-val="基本調味料"].active   { background: #5a4a1a; }
  .chip[data-val="初級"].active    { background: #2a7a5a; }
  .chip[data-val="中級"].active    { background: #4a6a2a; }
  .chip[data-val="上級"].active    { background: #5a2a7a; }
  .chip[data-val="マスター"].active { background: #1a3a7a; }
  .tag-course { background: #dce8f8; color: #1a2a5a; font-weight: 600; }

  .reset-btn {
    padding: 8px 16px;
    border-radius: 22px;
    border: 1.5px dashed var(--border);
    background: transparent;
    font-size: 13px;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .result-count {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 14px;
  }
  .result-count strong { color: var(--accent); font-weight: 500; }

  .recipe-list { display: flex; flex-direction: column; gap: 10px; }
  .recipe-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 16px;
    border: 1.5px solid var(--border);
    transition: all 0.2s;
    cursor: pointer;
  }
  .recipe-card:hover { border-color: var(--accent-light); box-shadow: 0 2px 8px rgba(122,79,46,0.1); }
  .recipe-card.open { border-color: var(--accent); }

  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }
  .card-arrow {
    color: var(--accent);
    font-size: 14px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .recipe-card.open .card-arrow { transform: rotate(180deg); }

  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag {
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .tag-主食         { background: #c8e8c0; color: #0a3a0a; }
  .tag-魚おかず     { background: #c0d8f0; color: #0a2a5a; }
  .tag-肉おかず     { background: #f0c8c8; color: #6a0a0a; }
  .tag-野菜おかず   { background: #c8eca0; color: #1a3a0a; }
  .tag-汁物         { background: #b8e8e8; color: #0a3a3a; }
  .tag-おやつ・スイーツ { background: #e8c0e8; color: #4a0a4a; }
  .tag-その他       { background: #d8d8d8; color: #2a2a2a; }
  .tag-基本調味料   { background: #e8d8a8; color: #3a2a00; }
  .tag-cond         { background: #f0dcc0; color: #5a2a00; }
  .tag-session      { background: var(--tag-bg); color: var(--text-light); }

  .card-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1.5px solid var(--bg);
  }
  .recipe-card.open .card-detail { display: block; }

  .detail-section { margin-bottom: 14px; }
  .detail-title {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: 0.08em;
  }

  .ingredients { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .ingredient-item {
    font-size: 14px;
    padding: 6px 10px;
    background: var(--bg);
    border-radius: 7px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .ingredient-name { color: var(--text); }
  .ingredient-amount { color: var(--text-light); white-space: nowrap; }

  .steps { list-style: none; }
  .steps li {
    font-size: 14px;
    color: var(--text);
    padding: 8px 0;
    border-bottom: 1px solid var(--bg);
    line-height: 1.7;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .steps li:last-child { border-bottom: none; }
  .step-num {
    width: 22px; height: 22px; min-width: 22px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    margin-top: 2px;
  }

  .memo-box {
    background: #fffbe8;
    border: 1.5px solid #d8c050;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #3a2a00;
    line-height: 1.7;
  }

  .edit-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 13px;
    color: var(--text-light);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .edit-btn:hover { border-color: var(--accent); color: var(--accent); }

  .fab {
    position: fixed;
    bottom: 24px; right: 16px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(122,79,46,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 99;
  }
  .fab:hover { transform: scale(1.08); }
  .admin-toggle {
    position: fixed;
    bottom: 24px; left: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    color: #aaa;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 44px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    max-width: 600px;
    margin: 0 auto;
  }
  .modal-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 16px;
    text-align: center;
  }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--text-light); margin-bottom: 6px; display: block; font-weight: 500; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-size: 15px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 400;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 85px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .condiment-checks { display: flex; flex-wrap: wrap; gap: 7px; }
  .cond-check {
    padding: 7px 13px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    background: var(--surface);
    color: var(--text-light);
    transition: all 0.2s;
  }
  .cond-check.checked { background: var(--accent); color: white; border-color: var(--accent); }

  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .btn-primary {
    flex: 1; padding: 13px;
    background: var(--accent); color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500; cursor: pointer;
  }
  .btn-secondary {
    padding: 13px 18px;
    background: transparent; color: var(--text-light);
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer;
  }
  .btn-danger {
    padding: 13px 14px;
    background: transparent; color: #b02020;
    border: 1.5px solid #f0a0a0; border-radius: 10px;
    font-size: 13px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer;
  }
  .no-result {
    text-align: center; padding: 48px 20px;
    color: var(--text-light); font-size: 14px;
  }
  .no-result div { font-size: 36px; margin-bottom: 10px; }
</style>
</head>

const APP_VERSION = '3';
const ADMIN_PASSWORD = 'hakko2026';
let isAdmin = false;

function toggleAdmin() {
  if (isAdmin) {
    isAdmin = false;
    document.getElementById('fabBtn').style.display = 'none';
    document.getElementById('adminToggle').style.color = '#aaa';
    renderRecipes();
  } else {
    const pw = prompt('管理者パスワードを入力してください');
    if (pw === ADMIN_PASSWORD) {
      isAdmin = true;
      document.getElementById('fabBtn').style.display = 'flex';
      document.getElementById('adminToggle').style.color = '#7a4f2e';
      renderRecipes();
    } else if (pw !== null) {
      alert('パスワードが違います');
    }
  }
}
if (localStorage.getItem('appVersion') !== APP_VERSION) {
  localStorage.removeItem('fermentRecipes');
  localStorage.setItem('appVersion', APP_VERSION);
}
let recipes = JSON.parse(localStorage.getItem('fermentRecipes') || 'null') || initialRecipes;
recipes = recipes.map(r => ({ course: '上級', ...r }));
let filterCourse = null;
let filterCondiment = null;
let filterGenre = null;
let editingId = null;

function saveToStorage() {
  localStorage.setItem('fermentRecipes', JSON.stringify(recipes));
}

function renderFilters() {
  const kf = document.getElementById('courseFilters');
  kf.innerHTML = COURSES.map(k =>
    `<button class="chip ${filterCourse===k?'active':''}" data-type="course" data-val="${k}" onclick="toggleCourse('${k}')">${k}</button>`
  ).join('');

  const cf = document.getElementById('condimentFilters');
  cf.innerHTML = CONDIMENTS.map(c =>
    `<button class="chip ${filterCondiment===c?'active':''}" data-type="condiment" data-val="${c}" onclick="toggleCondiment('${c}')">${c}</button>`
  ).join('');

  const gf = document.getElementById('genreFilters');
  gf.innerHTML = GENRES.map(g =>
    `<button class="chip ${filterGenre===g?'active':''}" data-type="genre" data-val="${g}" onclick="toggleGenre('${g}')">${g}</button>`
  ).join('');
}

function toggleCourse(val) {
  filterCourse = filterCourse === val ? null : val;
  renderAll();
}
function toggleCondiment(val) {
  filterCondiment = filterCondiment === val ? null : val;
  renderAll();
}
function toggleGenre(val) {
  filterGenre = filterGenre === val ? null : val;
  renderAll();
}
function resetFilters() {
  filterCourse = null;
  filterCondiment = null;
  filterGenre = null;
  renderAll();
}

function getFiltered() {
  return recipes.filter(r => {
    if (filterCourse && r.course !== filterCourse) return false;
    if (filterCondiment && !r.condiments.includes(filterCondiment)) return false;
    if (filterGenre && r.genre !== filterGenre) return false;
    return true;
  });
}

function genreTagClass(genre) {
  return 'tag-' + genre;
}

function renderAll() {
  renderFilters();
  const filtered = getFiltered();
  const list = document.getElementById('recipeList');
  const count = document.getElementById('resultCount');

  count.innerHTML = `<strong>${filtered.length}</strong> 品表示中（全${recipes.length}品）`;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="no-result"><div>🍽</div>該当するレシピがありません</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="recipe-card" id="card-${r.id}" onclick="toggleCard(${r.id})">
      <div class="card-header">
        <div class="card-title">${r.name}</div>
        <div class="card-arrow">▼</div>
      </div>
      <div class="card-tags">
        <span class="tag tag-course">${r.course}</span>
        <span class="tag ${genreTagClass(r.genre)}">${r.genre}</span>
        ${r.condiments.map(c => `<span class="tag tag-cond">${c}</span>`).join('')}
      </div>
      <div class="card-detail">
        ${r.ingredients && r.ingredients.length > 0 ? `
        <div class="detail-section">
          <div class="detail-title">【材料】</div>
          <div class="ingredients">
            ${r.ingredients.map(([name, amount]) => `
              <div class="ingredient-item">
                <span class="ingredient-name">${name}</span>
                <span class="ingredient-amount">${amount}</span>
              </div>
            `).join('')}
          </div>
        </div>` : ''}
        ${r.steps && r.steps.length > 0 ? `
        <div class="detail-section">
          <div class="detail-title">【作り方】</div>
          <ol class="steps">
            ${r.steps.map((s, i) => `
              <li><span class="step-num">${i+1}</span><span>${s}</span></li>
            `).join('')}
          </ol>
        </div>` : ''}
        ${r.memo ? `
        <div class="memo-box">💡 ${r.memo}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

// モーダル
function buildCondimentChecks(selected) {
  const container = document.getElementById('condimentChecks');
  container.innerHTML = CONDIMENTS.map(c => 
    `<span class="cond-check ${selected.includes(c)?'checked':''}" onclick="toggleCondCheck(this,'${c}')">${c}</span>`
  ).join('');
}

function toggleCondCheck(el, val) {
  el.classList.toggle('checked');
}

function getCheckedCondiments() {
  return [...document.querySelectorAll('.cond-check.checked')].map(el => el.textContent);
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'レシピを追加';
  document.getElementById('f_name').value = '';
  document.getElementById('f_course').value = '上級';
  document.getElementById('f_genre').value = '主食';
  document.getElementById('f_session').value = '';
  document.getElementById('f_ingredients').value = '';
  document.getElementById('f_steps').value = '';
  document.getElementById('f_memo').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  buildCondimentChecks([]);
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'レシピを編集';
  document.getElementById('f_name').value = r.name;
  document.getElementById('f_course').value = r.course || '上級';
  document.getElementById('f_genre').value = r.genre;
  document.getElementById('f_session').value = r.session || '';
  document.getElementById('f_ingredients').value = (r.ingredients || []).map(([n,a]) => `${n} ${a}`).join('\n');
  document.getElementById('f_steps').value = (r.steps || []).join('\n');
  document.getElementById('f_memo').value = r.memo || '';
  document.getElementById('deleteBtn').style.display = 'block';
  buildCondimentChecks(r.condiments || []);
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function saveRecipe() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { alert('料理名を入力してください'); return; }

  const ingredientLines = document.getElementById('f_ingredients').value.trim().split('\n').filter(l => l.trim());
  const ingredients = ingredientLines.map(line => {
    const parts = line.trim().split(/\s+/);
    const amount = parts.length > 1 ? parts.slice(1).join(' ') : '';
    return [parts[0], amount];
  });

  const steps = document.getElementById('f_steps').value.trim().split('\n').filter(l => l.trim());

  const data = {
    name,
    course: document.getElementById('f_course').value,
    genre: document.getElementById('f_genre').value,
    session: document.getElementById('f_session').value.trim() || '追加',
    condiments: getCheckedCondiments(),
    ingredients,
    steps,
    memo: document.getElementById('f_memo').value.trim(),
  };

  if (editingId) {
    const idx = recipes.findIndex(x => x.id === editingId);
    if (idx !== -1) recipes[idx] = { ...recipes[idx], ...data };
  } else {
    const maxId = recipes.reduce((m, r) => Math.max(m, r.id), 0);
    recipes.push({ id: maxId + 1, ...data });
  }

  saveToStorage();
  closeModalDirect();
  renderAll();
}

function deleteRecipe() {
  if (!editingId) return;
  if (!confirm('このレシピを削除しますか？')) return;
  recipes = recipes.filter(r => r.id !== editingId);
  saveToStorage();
  closeModalDirect();
  renderAll();
}

renderAll();
</script>
</body></html>
